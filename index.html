<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <h1>Online Form</h1>
    <br>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name">
    <br>
    <label for="father-name">FatherName:</label>
    <input type="text" id="father-name" name="father-name">
    <br>
    <label for="mother-name">MotherName:</label>
    <input type="text" id="mother-name" name="mother-name">
    <br>
    <label for="date of birth">date of birth:</label>
    <input type="date" id="date of birth" name="date of birth">
    <br>
    <label for="gender">gender:</label>
    <select id="gender" name="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
    </select>
    <br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br>
    <label for="phone numbar">phone numbar:</label>
    <input type="text" id="phone numbar" name="phone numbar">
    <br>
    <label for="state">state:</label>
    <input type="text" id="state" name="state">
    <br>
    <label for="city">city:</label>
    <input type="text" id="city" name="city">
    <br>
    <label for="pin code">pin code:</label>
    <input type="text" id="pin code" name="pin code">
    <br>
    <button type="submit">submit</button>


</body>

</html>
